name: Publish
on:
  release:
    types: [ released, prereleased ]
  workflow_dispatch:

jobs:
  runBinaryCompatibilityCheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache KMP tooling
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
            /tmp/benchmarks*
            .gradle
            build
            benchmark/build
            benchmark/.gradle
            library/build
            library/.gradle
          key: ${{ runner.os }}-binary-comp-${{ matrix.tag }}-${{ hashFiles('**/libs.versions.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-binary-comp-${{ matrix.tag }}-${{ hashFiles('**/libs.versions.toml') }}

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: 23
          distribution: 'zulu'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run benchmarks
        run: ./gradlew library:checkLegacyAbi

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
            /tmp/benchmarks*
            .gradle
            build
            benchmark/build
            benchmark/.gradle
            library/build
            library/.gradle
          key: ${{ runner.os }}-binary-comp-${{ matrix.tag }}-${{ hashFiles('**/libs.versions.toml') }}-${{ github.run_id }}

  publish:
    name: Release build and publish
    runs-on: macOS-latest
    needs: [ runBinaryCompatibilityCheck ]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 23
      - name: Publish to MavenCentral
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

